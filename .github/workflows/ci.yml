name: CI

# Runs the backend tests and a frontend lint/type-check/build on every push and
# pull request. Vercel and Render deploy from main on their own; this is the
# safety net that says whether what was pushed is sound. No secrets are used.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ssp-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ssp-nextjs/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  tracking:
    # Scripted visits to the built site, judged by the real events code on an in-memory database
    # (ssp-nextjs/tests/tracking). Nothing is sent to the live record; the menu is read from the live backend.
    name: Tracking test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ssp-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r ../backend/requirements.txt -r ../backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ssp-nextjs/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the stand-in backend
        run: |
          (python tests/tracking/stand_in_backend.py > /tmp/stand_in.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/__dump > /dev/null && break; sleep 1; done
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8765
      - name: Serve the built site and replay the visits
        run: |
          (npx next start -p 3001 > /tmp/site.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3001/story > /dev/null && break; sleep 1; done
          node tests/tracking/journeys.js http://localhost:3001
